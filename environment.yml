# Conda环境配置文件
name: tensor-network-research
channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10

  # 核心科学计算
  - numpy>=1.21
  - scipy>=1.7
  - matplotlib>=3.5
  - jupyter
  - jupyterlab

  # 张量网络库 (部分通过pip)
  - h5py>=3.6

  # 可视化
  - seaborn>=0.11
  - networkx>=2.6

  # 开发工具
  - pytest>=7.0
  - black>=22.0
  - flake8>=4.0

  # Pip安装的包
  - pip
  - pip:
    - tenpy>=0.10.0
    - quimb>=1.4.0
    - tensornetwork>=0.4.6
    - jax>=0.3.0
    - jaxlib>=0.3.0
    - optax>=0.1.0
    - plotly>=5.0.0
    - tqdm>=4.62.0
    - loguru>=0.6.0
    - ipywidgets>=7.6.0
